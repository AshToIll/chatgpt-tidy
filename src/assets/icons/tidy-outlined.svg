<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128">
  <title>ChatGPT Tidy — outlined icon</title>
  <!-- Original six-petal silhouette: keep the 24-unit viewBox and all petal coordinates. -->
  <defs>
    <g id="flower">
      <path transform="rotate(0 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
      <path transform="rotate(60 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
      <path transform="rotate(120 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
      <path transform="rotate(180 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
      <path transform="rotate(240 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
      <path transform="rotate(300 12 12)" d="M12 12C9.4 10.3 7.9 7.8 8.2 5.6C8.5 3.4 10 2 12 2C14 2 15.5 3.4 15.8 5.6C16.1 7.8 14.6 10.3 12 12Z"/>
    </g>
  </defs>
  <!-- Outline width is 1.3 viewBox units (0.43 px outside the silhouette at 16 px).
       Paint the original black shape last so no white seams appear between petals. -->
  <use href="#flower" fill="#ffffff" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
  <use href="#flower" fill="#000000"/>
  <!-- Solid hand, not a transparency mask. Width and center size match the original. -->
  <g fill="#ffffff" stroke="#ffffff">
    <path d="M12 17V12L16.3 7.7" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="1" stroke="none"/>
  </g>
</svg>
