<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIDY Export Preview QA</title>
  <link rel="stylesheet" href="/src/app/sidepanel/panel.css?qa=light-navigation">
  <link rel="stylesheet" href="/src/features/export/ui/export.css?qa=light-navigation">
  <style>
    .tidy-shell { width: var(--qa-width, 320px); max-width: 100%; height: 700px; }
    .qa-notice { padding: 10px; color: var(--text-secondary); font: 12px/1.5 monospace; }
  </style>
</head>
<body>
  <main class="tidy-shell">
    <section class="time-panel">
      <header class="time-panel__header"><div><h1>导出</h1><p>整理并保存对话</p></div></header>
      <div class="time-panel__body" data-active-route="export"><section id="export-view" class="module-view is-active"></section></div>
    </section>
    <nav class="time-dock" aria-label="TIDY"><button class="dock-button is-active" type="button" title="导出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v10.2m0 0 3.2-3.2M12 13.7l-3.2-3.2"></path><path d="M5 13.25v5c0 .97.78 1.75 1.75 1.75h10.5c.97 0 1.75-.78 1.75-1.75v-5"></path></svg></button></nav>
  </main>
  <aside class="qa-notice">
    <p>仅本地合成预览，使用真实导出组件；不连接 ChatGPT、不下载文件。</p>
    <output id="qa-feedback" aria-live="polite">可切换当前会话／批量导出，以及 Markdown／JSON／TXT／PDF。</output>
  </aside>
  <script src="/src/features/export/model/export.js"></script>
  <script src="/src/features/export/model/export-preview.js"></script>
  <script src="/src/features/export/engine/i18n.js"></script>
  <script src="/src/features/export/engine/normalize.js"></script>
  <script src="/src/features/export/engine/plan.js"></script>
  <script src="/src/features/export/engine/inline-content.js"></script>
  <script src="/src/features/export/engine/serializers.js"></script>
  <script type="module" src="/tests/fixtures/export-preview.js?qa=light-navigation"></script>
</body>
</html>
